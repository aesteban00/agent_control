services:
  # ===========================================
  # MCP Server with Guardrails (for VS Code)
  # All security enforcement happens here
  # ===========================================
  mcp-secure-agent:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: mcp-secure-agent
    env_file:
      - .env
    volumes:
      - .:/app
    working_dir: /app
    stdin_open: true   # Required for MCP STDIO
    tty: true          # Keep container running
    command: ["tail", "-f", "/dev/null"]  # Keep alive for docker exec
    # VS Code invokes: docker exec -i mcp-secure-agent python3 mcp_proxy_server.py
